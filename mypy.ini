# mypy configuration for the AMG engine scripts (CLAUDE.md §6.9; roadmap 1.31).
# The gate is the engine: run from the repo root with NO arguments — `files` below
# pins exactly the 13 engine modules, so `python -m mypy` checks the engine and skips
# the selftests (test code; excluded by decision, roadmap §5 Stage 12 / 1.31).
# Dev-only: the installer copies just the amg-* skills/agents, not this file.
#
# The engine scripts live in three skill dirs and import each other across them
# (consolidate -> graph_store, lifecycle -> consolidate, ...) via a runtime
# sys.path.insert; mypy_path mirrors that so the cross-skill imports resolve in a
# single strict pass over all modules.
[mypy]
mypy_path = skills/amg-bootstrap/scripts, skills/amg-retrieve/scripts, skills/amg-consolidate/scripts
files = skills/amg-bootstrap/scripts/graph_store.py,
        skills/amg-bootstrap/scripts/reconcile.py,
        skills/amg-bootstrap/scripts/extract_structure.py,
        skills/amg-bootstrap/scripts/notes.py,
        skills/amg-bootstrap/scripts/lifecycle.py,
        skills/amg-bootstrap/scripts/migrate_schema.py,
        skills/amg-retrieve/scripts/retrieve.py,
        skills/amg-retrieve/scripts/embed.py,
        skills/amg-retrieve/scripts/eval_retrieval.py,
        skills/amg-retrieve/scripts/inspect_graph.py,
        skills/amg-retrieve/scripts/bench.py,
        skills/amg-retrieve/scripts/index_store.py,
        skills/amg-consolidate/scripts/consolidate.py
strict = True

# Optional, soft-imported third-party libraries without type stubs. Each is
# imported inside a try/except and degrades gracefully at runtime, so mypy must
# not fail on their missing stubs (the import names become Any locally).
[mypy-model2vec.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-tree_sitter.*]
ignore_missing_imports = True

[mypy-tree_sitter_language_pack.*]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-pptx.*]
ignore_missing_imports = True

# Selftest files are EXCLUDED from the strict gate (decision, roadmap §5 Stage 12 /
# audit 1.31). They are test code: assert-based cases, fixtures, and — in
# selftest_embed — deliberately injected stub backends incompatible with the real
# _Embedder type. Strict-typing them adds `# type: ignore` noise without catching any
# engine bug; the engine modules above ARE fully strict-checked. So `python -m mypy
# skills/*/scripts/*.py` gates the engine and skips the tests.
[mypy-selftest_*]
ignore_errors = True
