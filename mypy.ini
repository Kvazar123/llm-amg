# mypy configuration for the AMG engine scripts (CLAUDE.md §6.9; roadmap 1.31).
# Run from the repo root:  python -m mypy skills/*/scripts/*.py
# Dev-only: the installer copies just the amg-* skills/agents, not this file.
#
# The engine scripts live in three skill dirs and import each other across them
# (consolidate -> graph_store, lifecycle -> consolidate, ...) via a runtime
# sys.path.insert; mypy_path mirrors that so the cross-skill imports resolve in a
# single strict pass over all modules.
[mypy]
mypy_path = skills/amg-bootstrap/scripts, skills/amg-retrieve/scripts, skills/amg-consolidate/scripts
strict = True

# Optional, soft-imported third-party libraries without type stubs. Each is
# imported inside a try/except and degrades gracefully at runtime, so mypy must
# not fail on their missing stubs (the import names become Any locally).
[mypy-model2vec.*]
ignore_missing_imports = True

[mypy-sentence_transformers.*]
ignore_missing_imports = True

[mypy-tree_sitter.*]
ignore_missing_imports = True

[mypy-tree_sitter_language_pack.*]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-docx.*]
ignore_missing_imports = True

[mypy-openpyxl.*]
ignore_missing_imports = True

[mypy-pptx.*]
ignore_missing_imports = True
