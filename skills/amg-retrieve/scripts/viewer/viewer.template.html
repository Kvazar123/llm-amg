<!DOCTYPE html>
<!-- AMG graph — self-contained 3D viewer (roadmap Stage 15).
     export_graph.py replaces the three markers below with the graph JSON, the vendored
     3d-force-graph library, and the AMG viewer glue. The result is one offline file:
     no server, no network, read-only. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMG graph</title>
<script>
  /* Set the theme BEFORE first paint (no flash): a saved choice, else the OS preference.
     viewer.js reads this same attribute, so detection lives in one place. */
  (function () {
    try {
      var t = localStorage.getItem("amg-theme")
        || ((window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches) ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
<style>
  :root {
    /* GitHub-dark palette (default). The toggle sets data-theme="light" for the light set. */
    --bg: #0d1117; --surface: #1c222aeb; --surface-hover: #232a32; --surface-second: #293038b8;
    --line: #3d444db3; --fg: #f0f6fc; --muted: #9198a1; --faint: #656c76;
    --link: #88baff; --accent: #2f81f7; --bar: rgba(13,17,23,.82); --scrollbar-thumb: #384047;
  }
  :root[data-theme="light"] {
    /* GitHub-light palette. */
    --bg: #ffffff; --surface: #f4f6f8eb; --surface-hover: #eaeef2; --surface-second: #e6eaeeb8;
    --line: #d1d9e0; --fg: #1f2328; --muted: #59636e; --faint: #818b98;
    --link: #4285cb; --accent: #0969da; --bar: rgba(255,255,255,.82); --scrollbar-thumb: #c9d1d8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
  #graph { position: fixed; inset: 0; }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }

  /* top bar */
  #topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex;
    align-items: center; gap: 10px; padding: 8px 12px; background: var(--bar);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  #topbar .title { font-weight: 600; letter-spacing: .2px; }
  #topbar .meta { color: var(--muted); font-size: 13px; }
  #topbar .spacer { flex: 1; }
  #search { background: var(--surface); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 6px 10px; width: 230px; outline: none; font-size: 13px; }
  #search:focus { border-color: var(--accent); }
  #search::placeholder { font-size: 13px; color: var(--faint); }
  button.tb, select.tb { background: var(--surface); border: 1px solid var(--line); color: var(--fg);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  button.tb:hover, select.tb:hover { background: var(--surface-hover); }  /* lighten, no blue */
  button.tb.on { border-color: var(--accent); }                          /* active = blue border */
  button.tb.icon { padding: 5px 7px; line-height: 0; }                    /* sun/moon toggle */
  .tb svg { width: 14px; height: 14px; display: block; }
  /* node hover tooltip (injected by the graph lib); neutralize the lib's default box,
     theme our own via the vars, and give it a soft (gradient) shadow like the panels. */
  .float-tooltip-kap { background: transparent !important; padding: 0 !important; box-shadow: none !important; }
  .nl { max-width: 320px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; color: var(--fg); font-size: 12px; line-height: 1.55;
    box-shadow: 0 6px 20px rgba(0,0,0,.30); }
  .nl .sub { color: var(--muted); }

  /* popovers (filters, legend) */
  .pop { position: fixed; top: 52px; z-index: 11; background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 220px;
    max-height: 75vh; overflow: auto; box-shadow: 0 8px 22px rgba(0,0,0,.38); display: none; }
  .pop h4 { margin: 16px 0 6px; font-size: 12px; text-transform: uppercase; color: var(--muted);
    letter-spacing: .6px; }
  .pop h4:first-child { margin-top: 0; }                 /* first section flush to the top */
  .pop label { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 3px 0;
    cursor: pointer; }
  .pop .row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 0; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; }
  .count { color: var(--muted); margin-left: auto; font-size: 12px; }
  input[type=range] { width: 150px; accent-color: #4084ca; }

  /* side panel */
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 92vw; z-index: 12;
    background: var(--surface); border-left: 1px solid var(--line); transform: translateX(110%);
    transition: transform .18s ease; overflow: auto; padding: 16px 18px 40px; }
  #panel.open { transform: translateX(0); }
  #panel .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: var(--muted);
    font-size: 20px; line-height: 1; background: none; border: none; }
  #panel .pid { word-break: break-all; font-size: 16px; color: var(--link); margin: 2px 40px 16px 0; }
  #panel .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .badge { font-size: 11px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--fg); background: var(--surface-second); }
  #panel h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); letter-spacing: .6px;
    margin: 16px 0 6px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  #panel h3.frontmatter { border-bottom: none; }       /* the <pre> below already draws many lines */
  #panel .summary { font-size: 14px; line-height: 1.5; }
  #panel .ptr { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #panel pre { background: var(--surface-second); border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 12px; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  #panel .edge { font-size: 12px; padding: 4px 0; line-height: 18px; border-bottom: 1px dashed var(--line); }
  #panel .edge a { color: var(--link); cursor: pointer; text-decoration: none; word-break: break-all; }
  #panel .edge a:hover { text-decoration: underline; }
  #panel .rel { display: inline-block; min-width: 92px; color: var(--muted); }

  #hint { position: fixed; bottom: 8px; left: 12px; z-index: 9; color: var(--muted);
    font-size: 11px; pointer-events: none; }
  #empty { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px; z-index: 8; }

  /* frosted glass — translucent surfaces over the graph (Safari needs the -webkit- prefix) */
  #panel, .nl, .pop { -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  /* an empty swatch = "this status does not recolor the node — it keeps its bucket color" */
  .swatch.empty { background: transparent; border: 2px solid var(--muted); }
  #minw { height: 4px; }
  input[type=checkbox] { cursor: pointer; accent-color: #4084ca; }
  /* thin custom scrollbars: WebKit/Blink + Firefox */
  * { scrollbar-width: thin; scrollbar-color: var(--scrollbar-thumb) var(--surface-second); }
  *::-webkit-scrollbar { width: 6px; height: 6px; }
  *::-webkit-scrollbar-thumb { background-color: var(--scrollbar-thumb); border-radius: 3px; }
  *::-webkit-scrollbar-track { background-color: var(--surface-second); }
</style>
</head>
<body>
<div id="graph"></div>
<div id="empty">No nodes to show — build the graph first (/amg sync), then re-export.</div>

<div id="topbar">
  <span class="title">AMG</span>
  <span class="meta" id="meta"></span>
  <span class="spacer"></span>
  <input id="search" type="search" placeholder="search id / summary…" autocomplete="off">
  <button class="tb" id="btn-filters">Filters</button>
  <button class="tb" id="btn-legend">Legend</button>
  <button class="tb" id="btn-cluster" title="Color nodes by cluster — their heaviest part_of topic (hub)">Clusters</button>
  <button class="tb" id="btn-large" title="Large-graph mode: start with hubs, expand on click">Large mode</button>
  <button class="tb" id="btn-reset" title="Reset camera">Reset view</button>
  <select class="tb" id="quality" title="Render quality: smoothness vs speed (auto adapts to node count)">
    <option value="auto">Quality: auto</option>
    <option value="high">Quality: high</option>
    <option value="medium">Quality: medium</option>
    <option value="low">Quality: low</option>
  </select>
  <button class="tb icon" id="btn-theme" title="Toggle light / dark"></button>
</div>

<div class="pop" id="filters"></div>
<div class="pop" id="legend"></div>

<aside id="panel">
  <button class="close" id="panel-close" aria-label="close">×</button>
  <div class="pid mono" id="p-id"></div>
  <div class="badges" id="p-badges"></div>
  <h3>Summary</h3>
  <div class="summary" id="p-summary"></div>
  <div class="ptr mono" id="p-ptr"></div>
  <div id="p-edges-wrap" style="display:none"><h3>Edges</h3><div id="p-edges"></div></div>
  <div id="p-body-wrap" style="display:none"><h3>Body</h3><pre id="p-body"></pre></div>
  <h3 class="frontmatter">Frontmatter</h3><pre class="mono" id="p-fm"></pre>
</aside>

<div id="hint">left-click: rotate · mouse-wheel/middle-click: zoom · right-click: pan</div>

<script type="application/json" id="amg-data">__AMG_DATA__</script>
<script>/*__AMG_LIB__*/</script>
<script>/*__AMG_VIEWER__*/</script>
</body>
</html>
