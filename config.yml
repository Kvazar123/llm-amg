# =============================================================================
# AMG - Associative Memory Graph.  Store configuration + activation state.
# (.claude/amg/config.yml)  Control-plane file: keep it in English.
#
# Presence of this file with `active: true` turns AMG on for this project.
# =============================================================================

active: true
schema_version: 2

# Lifecycle automation (boolean, like `active`). true: the model runs the session loop
# itself, and the SessionStart/SessionEnd hooks (settings.json) heal the store, fold
# weights, and refresh the digest automatically. false: nothing runs on its own — only
# the /amg commands or an explicit request act. Every automatic step has a manual analog.
automation: true

# Human-facing memory language for doc/notes summaries. Structural metadata,
# edge-type names, and code identifiers stay English regardless. ISO 639-1.
working_language: ru

# -----------------------------------------------------------------------------
# Input. One unified entry: list any folders; each file's TYPE is detected
# automatically (code / doc / data) and routed to the right chunker. You do NOT
# name folders "code" or "docs" - a folder may hold a mix of .py, .md, .json, etc.
#
#   mirror_path : the graph is a LIVE PROJECTION of these paths. Reconcile keeps
#                 them equal: file added -> node; changed -> updated; deleted -> purged.
#                 Use for what you edit (code, the guides you maintain).
#   absorb_path : ingested ONCE into independent notes. Deleting the source later
#                 changes nothing. Use for raw input you mine (chat logs, data dumps).
#
# Each key is a single path (string) OR a YAML list of paths. Either may be omitted.
#
# PDF/DOCX/XLSX are extracted only if their (pure-Python) libraries are installed:
#   pip install pypdf python-docx openpyxl
# Without them those files are simply skipped. Run `extract_structure.py . --stats`
# to see which extractors are active.
# -----------------------------------------------------------------------------
mirror_path:
  - src
  - doc

# absorb_path:
#   - data

# Captured sessions (Stage 9). At SessionEnd (a Claude Code hook) the dialogue is
# dumped to <agent_dir>/amg/sessions/YYYY-MM-DD-HHMM.md — role markers, no raw model
# thinking — and then ingested like any other source. The location is DERIVED from the
# store root, so it is correct under any agent dir (.claude / .agents / ...) with no
# extra config; uncomment `sessions` only to place the dumps elsewhere. In an agent
# environment without the SessionEnd hook there is no auto-dump — the portable path is
# the activation loop plus capturing notes as you go (notes survive regardless).
#
#   session_policy: absorb -> distill once; the dump file may be deleted later and the
#                             summary stays.
#                   mirror -> keep nodes while the file exists, so every detail of a
#                             valuable dialogue stays retrievable in full.
# sessions: .claude/amg/sessions     # optional override; default is <store>/sessions
session_policy: absorb

# What gets ignored (the pre-semantic hygiene filter). Three stacking layers:
#   1. built-in defaults: the agent dir (.claude / .agents / your configured one),
#      .git, node_modules, .venv, __pycache__, dist, build, target, binaries, ...
#   2. the repo's .gitignore, IF present - honoured as a plain file (no git needed).
#      An EXPLICITLY listed source whose root is gitignored is still ingested (you named
#      it on purpose, e.g. absorb_path: logs where .gitignore has logs/); .gitignore
#      still filters junk inside a wide source like mirror_path: . - set
#      respect_gitignore: false to ignore .gitignore entirely (fully config-driven).
#   3. these config globs (bash-style, like .gitignore lines), all OPTIONAL:
#        exclude        - applies to every source
#        mirror_exclude - applies to mirror_path sources only
#        absorb_exclude - applies to absorb_path sources only
#      (per-intent lists are ADDED on top of the global exclude.)
respect_gitignore: true
exclude: []
# mirror_exclude:
#   - "**/*.generated.*"
# absorb_exclude:
#   - "*.tmp"

# -----------------------------------------------------------------------------
# Optional, for the most out of non-Python code. If `tree-sitter-language-pack`
# is installed, other languages get function-level units + call edges; if not,
# Python still works fully (stdlib ast) and other code becomes one unit per file.
#   pip install tree-sitter tree-sitter-language-pack
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Model tiering for subagents. Strongest model only for foundational synthesis.
# -----------------------------------------------------------------------------
models:
  structural_extraction: none      # extract_structure.py - exact, reproducible
  discovery:            haiku       # read-only file discovery / search
  module_summary:       sonnet      # per-file / per-section summaries (bulk)
  synthesis:            opus        # architecture overview, cross-domain edges, gaps

# -----------------------------------------------------------------------------
# Spreading-activation retrieval (amg-retrieve). Query-biased Personalized PageRank.
# -----------------------------------------------------------------------------
retrieval:
  damping: 0.85                   # how far activation spreads
  max_hops: 30                    # power-iteration cap
  activation_threshold: 0.02      # ignore nodes below this final activation
  token_budget:
    strategic: 4000               # hubs / overviews
    tactical: 10000                # modules
    operational: 24000             # code pointers + doc/notes bodies in focus
    periphery_links: 60           # link-only references to the next ring
  relation_priors:                # how strongly each edge type conducts (beta)
    documents: 0.9
    implements: 0.9
    specifies: 0.9
    calls: 0.8
    depends_on: 0.8
    defines: 0.7
    part_of: 0.7
    imports: 0.6
    refines: 0.6                  # a sharpening/refinement link (builder)
    exemplifies: 0.6              # an example-of link: concrete -> concept (builder)
    relates_to: 0.5
    supersedes: 0.3              # like contradicts: links a retired claim; conducts weakly
    contradicts: 0.3
  # Per-status multiplier on the FINAL activation (re-ranks by node validity).
  # Merged key-by-key over the built-ins, so listing a subset is safe.
  status_prior:
    active: 1.0
    stale: 1.0                    # not penalized — flagged in the pack instead
    superseded: 0.2               # a retired claim must not compete as an active fact
  # Optional semantic seed enrichment (Stage 1.5). Improves recall on paraphrased
  # queries by blending embedding similarity into the seed; the PPR spread is
  # unchanged. OPTIONAL: with no backend installed, retrieval stays pure-BM25.
  #   pip install model2vec            (light, CPU, recommended)  -- or --
  #   pip install sentence-transformers (heavier, needs torch)
  # The seed is OPTIONAL enrichment (markdown is the source of truth), so defaults are
  # light, retrieval/multilingual-tuned models — not the heavy ~8B MTEB leaders. The
  # per-backend default is chosen by working_language:
  #     en    -> model2vec potion-retrieval-32M | st all-MiniLM-L6-v2
  #     non-en-> model2vec potion-multilingual-128M | st paraphrase-multilingual-MiniLM-L12-v2
  # Override `model:` with any HF id for more quality (e.g. Alibaba-NLP/gte-multilingual-base),
  # and size the gain with: eval_retrieval.py --compare-embeddings
  embeddings:
    enabled: off        # auto = use if a backend is installed | on | off
    backend: auto       # auto | model2vec | sentence-transformers
    model: ""           # "" = per-backend default (multilingual when working_language != en)
    blend: 0.5          # 0 = pure BM25 .. 1 = pure semantic

# -----------------------------------------------------------------------------
# Weight maintenance (Hebbian reinforcement + decay), applied during consolidation.
# -----------------------------------------------------------------------------
weights:
  default_edge_weight: 0.5        # starting weight for a semantic edge with no explicit w
  hebbian_rate: 0.10
  decay_rate: 0.02
  prune_below: 0.05
  part_of_renormalize: true
  # Hebbian weight updates are OFF until an eval on/off comparison proves they help:
  # the co-activation signal is partly circular (weights -> pack -> pairs -> weights),
  # so `consolidate.py weights` only ACCUMULATES coact (which feeds salience) and
  # leaves w untouched while this is false. Flip on after measuring the uplift.
  apply_hebbian: false

# -----------------------------------------------------------------------------
# Compaction (amg-consolidate). Off by default; a branch is compressed only when
# it exceeds its budget, minimally, archiving originals (reversible).
# -----------------------------------------------------------------------------
compaction:
  enabled: true
  default_branch_budget_nodes: 400
  default_branch_budget_tokens: 200000
  protect_types: [decision, adr]
  protect_min_centrality: 0.7
  archive_dir: archive
  steps: [summarize_episodes, merge_near_duplicates, introduce_subhub, lossy_shorten]

# -----------------------------------------------------------------------------
# Consolidation plan tunables (near-duplicate detection + episodic classification).
# Previously hardcoded in consolidate.py; surfaced here so they are overridable.
# -----------------------------------------------------------------------------
near_duplicate_sim: 0.82           # Jaccard threshold to flag two nodes as merge candidates
# Episodic types: authored captures consolidation may summarize / rank by salience /
# promote / retire. open_question and plan are transient states awaiting resolution, so
# they are revisited here rather than living forever active. decision/adr are NOT listed:
# they are protected commitments (protect_types above).
episodic_types: [section, note, open_question, plan]
stale_age_days: 30                 # recency basis for the salience freshness signal

# -----------------------------------------------------------------------------
# Eval gate: compaction must not silently hurt retrieval. When `apply` carries a
# compression action, the actions are measured on a CLONE of the graph first; the
# real graph is touched only if recall holds. Measured on labeled cases (pack
# recall + hop-recall), before vs after.
#
# Robust by default: if `cases` is missing / empty / none of its gold_ids resolve
# in this graph (e.g. the shipped template), the gate SKIPS with a note — it never
# falsely rejects. Point `cases` at your own labeled file to arm it (ids from
# inspect_graph.py). Deltas are (after - before): a drop below the threshold fails.
# on_fail: reject (don't apply) | warn (apply + record warning) | revert (= reject:
# measuring before commit makes a post-commit rollback unnecessary).
# -----------------------------------------------------------------------------
eval_gate:
  enabled: true
  cases: .claude/skills/amg-retrieve/evals/cases.json   # template ships unresolved -> skip
  min_recall_delta: -0.02       # tolerated pack-recall drop (after - before)
  min_hop_recall_delta: -0.02   # tolerated hop-recall drop
  on_fail: reject               # reject | warn | revert (revert == reject here)
